name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Create clean Flutter project and merge code
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --org com.alibakar --project-name network_scanner .
          cp ../lib/main.dart lib/main.dart
          flutter pub add network_info_plus permission_handler
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES"/>' android/app/src/main/AndroidManifest.xml
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ali-Bakar-Network-Scanner
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
